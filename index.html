<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemma 3 4B Chat</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f0f1a;
            color: #e0e0e0;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header {
            background: #1a1a2e;
            padding: 16px 24px;
            border-bottom: 1px solid #2a2a4a;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }
        header h1 { font-size: 18px; font-weight: 600; color: #fff; }
        #status {
            font-size: 13px;
            padding: 4px 12px;
            border-radius: 12px;
            background: #2a2a4a;
            color: #aaa;
        }
        #status.ready { background: #1a4a2a; color: #6f6; }
        #status.loading { background: #2a2a4a; color: #aa6; }
        #status.error { background: #4a1a1a; color: #f66; }
        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .msg {
            max-width: 75%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.5;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        .msg img { max-width: 100%; border-radius: 8px; margin-top: 8px; display: block; }
        .msg.user { align-self: flex-end; background: #4a3f8f; color: #fff; }
        .msg.assistant { align-self: flex-start; background: #1e1e36; color: #d0d0d0; }
        .msg.assistant.pending::after {
            content: '…';
            animation: blink 1.2s infinite;
        }
        @keyframes blink { 0%,100% { opacity: .3; } 50% { opacity: 1; } }
        .msg.error { align-self: flex-start; background: #4a1a1a; color: #f99; }
        #preview {
            display: none;
            padding: 8px 24px;
            background: #1a1a2e;
            border-top: 1px solid #2a2a4a;
            align-items: center;
            gap: 12px;
            font-size: 13px;
            color: #aaa;
        }
        #preview.on { display: flex; }
        #preview img { height: 44px; border-radius: 6px; }
        #preview button {
            margin-left: auto;
            background: none;
            border: 1px solid #3a3a5a;
            color: #aaa;
            border-radius: 6px;
            padding: 4px 10px;
            cursor: pointer;
        }
        #input-area {
            padding: 16px 24px;
            background: #1a1a2e;
            border-top: 1px solid #2a2a4a;
            display: flex;
            gap: 12px;
            flex-shrink: 0;
        }
        #message-input {
            flex: 1;
            padding: 12px 16px;
            background: #0f0f1a;
            border: 1px solid #2a2a4a;
            border-radius: 8px;
            color: #e0e0e0;
            font-size: 15px;
            outline: none;
        }
        #message-input:focus { border-color: #4a3f8f; }
        #message-input::placeholder { color: #555; }
        #attach-button, #send-button {
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 500;
        }
        #attach-button {
            padding: 12px 16px;
            background: #2a2a4a;
            color: #ccc;
        }
        #attach-button:hover { background: #3a3a5a; }
        #send-button { padding: 12px 24px; background: #4a3f8f; color: #fff; }
        #send-button:hover { background: #5a4f9f; }
        #send-button:disabled, #attach-button:disabled { background: #262636; color: #666; cursor: not-allowed; }
        #overlay {
            position: fixed;
            inset: 0;
            background: rgba(15,15,26,.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            z-index: 100;
        }
        #overlay.hidden { display: none; }
        .spinner {
            width: 48px; height: 48px;
            border: 4px solid #2a2a4a;
            border-top-color: #4a3f8f;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        #overlay p { color: #888; font-size: 15px; text-align: center; max-width: 400px; }
    </style>
</head>
<body>
    <div id="overlay">
        <div class="spinner"></div>
        <p id="overlay-text">Đang khởi động...</p>
    </div>
    <header>
        <h1>Gemma 3 4B Chat</h1>
        <div id="status" class="loading">Đang tải...</div>
    </header>
    <div id="messages"></div>
    <div id="preview">
        <img id="preview-img" alt="">
        <span id="preview-name"></span>
        <button id="preview-remove" type="button">Bỏ ảnh</button>
    </div>
    <div id="input-area">
        <input type="file" id="file-input" accept="image/*" hidden>
        <button id="attach-button" type="button" disabled>Ảnh</button>
        <input type="text" id="message-input" placeholder="Nhập tin nhắn..." disabled>
        <button id="send-button" disabled>Gửi</button>
    </div>
    <script>
        const messagesEl = document.getElementById('messages');
        const inputEl = document.getElementById('message-input');
        const sendBtn = document.getElementById('send-button');
        const attachBtn = document.getElementById('attach-button');
        const fileInput = document.getElementById('file-input');
        const statusEl = document.getElementById('status');
        const overlay = document.getElementById('overlay');
        const overlayText = document.getElementById('overlay-text');
        const preview = document.getElementById('preview');
        const previewImg = document.getElementById('preview-img');
        const previewName = document.getElementById('preview-name');
        const previewRemove = document.getElementById('preview-remove');

        let history = [];
        let pendingImage = null;   // data URL để hiển thị
        let pendingBase64 = null;  // base64 thuần để gửi API

        function addMsg(role, text, imageDataUrl) {
            const div = document.createElement('div');
            div.className = 'msg ' + role;
            if (text) div.textContent = text;
            if (imageDataUrl) {
                const img = document.createElement('img');
                img.src = imageDataUrl;
                div.appendChild(img);
            }
            messagesEl.appendChild(div);
            messagesEl.scrollTop = messagesEl.scrollHeight;
            return div;
        }

        function setBusy(busy) {
            inputEl.disabled = busy;
            sendBtn.disabled = busy;
            attachBtn.disabled = busy;
        }

        function showError(text) {
            const div = addMsg('error', text);
            messagesEl.scrollTop = messagesEl.scrollHeight;
            return div;
        }

        async function checkHealth() {
            try {
                const res = await fetch('/health');
                const data = await res.json();
                statusEl.textContent = data.message || data.status;
                statusEl.className = data.status;
                if (data.status === 'ready') {
                    overlay.classList.add('hidden');
                    setBusy(false);
                } else if (data.status === 'error') {
                    overlayText.textContent = data.message || 'Không tải được model.';
                } else {
                    overlayText.textContent = data.message || 'Đang chuẩn bị model...';
                }
                return data.status === 'ready';
            } catch (e) {
                statusEl.textContent = 'Không kết nối được máy chủ';
                statusEl.className = 'error';
                return false;
            }
        }

        async function waitForReady() {
            while (true) {
                if (await checkHealth()) return;
                await new Promise(r => setTimeout(r, 2000));
            }
        }

        async function send() {
            const text = inputEl.value.trim();
            if (!text && !pendingBase64) return;

            const imageForDisplay = pendingImage;
            const imageForApi = pendingBase64;
            addMsg('user', text, imageForDisplay);
            inputEl.value = '';
            clearPendingImage();
            setBusy(true);

            const bubble = addMsg('assistant', '', null);
            bubble.classList.add('pending');

            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text, history, image: imageForApi }),
                });
                const data = await res.json();
                bubble.classList.remove('pending');
                if (!res.ok) {
                    bubble.classList.add('error');
                    bubble.textContent = data.error || data.message || 'Có lỗi xảy ra.';
                } else {
                    bubble.textContent = data.response;
                    history.push({ role: 'user', content: text || 'Mô tả ảnh này bằng tiếng Việt.' });
                    history.push({ role: 'assistant', content: data.response });
                }
            } catch (e) {
                bubble.classList.remove('pending');
                bubble.classList.add('error');
                bubble.textContent = 'Không gửi được tin nhắn: ' + e;
            } finally {
                setBusy(false);
                inputEl.focus();
                messagesEl.scrollTop = messagesEl.scrollHeight;
            }
        }

        function clearPendingImage() {
            pendingImage = null;
            pendingBase64 = null;
            preview.classList.remove('on');
            previewImg.removeAttribute('src');
            previewName.textContent = '';
            fileInput.value = '';
        }

        attachBtn.addEventListener('click', () => fileInput.click());
        previewRemove.addEventListener('click', clearPendingImage);
        sendBtn.addEventListener('click', send);
        inputEl.addEventListener('keydown', (e) => { if (e.key === 'Enter') send(); });

        fileInput.addEventListener('change', () => {
            const file = fileInput.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = () => {
                pendingImage = reader.result;
                pendingBase64 = String(reader.result).split(',')[1];
                previewImg.src = pendingImage;
                previewName.textContent = file.name;
                preview.classList.add('on');
            };
            reader.readAsDataURL(file);
        });

        waitForReady();
    </script>
</body>
</html>
