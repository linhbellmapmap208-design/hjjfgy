services:
  ollama:
    image: ollama/ollama:latest
    restart: on-failure
    volumes:
      - ollama-models:/root/.ollama
    environment:
      # Trả lời nhanh hơn: một request dùng hết 4 core và giữ model trong RAM.
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_KEEP_ALIVE=-1
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  web:
    image: python:3.12-slim
    working_dir: /app
    restart: on-failure
    volumes:
      - ./:/app
      - pip-cache:/root/.cache/pip
    environment:
      - PYTHONUNBUFFERED=1
      - OLLAMA_HOST=http://ollama:11434
      - LLM_NUM_THREADS=4
      - BASE44_PREVIEW_MODE
    env_file:
      - /run/base44/app.env
    ports:
      - "3000:8000"
    depends_on:
      ollama:
        condition: service_healthy
    command:
      - sh
      - -ec
      - pip install --no-cache-dir -r requirements.txt && exec uvicorn app:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=3).status == 200 else 1)" || exit 1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  bot:
    image: python:3.12-slim
    working_dir: /app
    restart: on-failure
    volumes:
      - ./:/app
      - pip-cache:/root/.cache/pip
    environment:
      - PYTHONUNBUFFERED=1
      - OLLAMA_HOST=http://ollama:11434
      - LLM_NUM_THREADS=4
    env_file:
      - /run/base44/app.env
    depends_on:
      ollama:
        condition: service_healthy
    command:
      - sh
      - -ec
      - pip install --no-cache-dir -r requirements.txt && exec python discord_bot.py
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import os,urllib.request; t=os.environ.get('DISCORD_BOT_TOKEN','').strip(); assert t, 'missing token'; req=urllib.request.Request('https://discord.com/api/v10/users/@me'); req.add_header('Authorization','Bot '+t); req.add_header('User-Agent','DiscordBot (base44, 1.0)'); urllib.request.urlopen(req, timeout=10)" || exit 1
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 45s

volumes:
  ollama-models:
  pip-cache:
