services:
  ollama:
    image: ollama/ollama:latest
    restart: on-failure
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  web:
    image: python:3.12-slim
    working_dir: /app
    restart: on-failure
    volumes:
      - ./:/app
      - pip-cache:/root/.cache/pip
    environment:
      - PYTHONUNBUFFERED=1
      - OLLAMA_HOST=http://ollama:11434
      - BASE44_PREVIEW_MODE
    ports:
      - "3000:8000"
    depends_on:
      ollama:
        condition: service_healthy
    command:
      - sh
      - -ec
      - pip install --no-cache-dir -r requirements.txt && exec uvicorn app:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=3).status == 200 else 1)" || exit 1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  ollama-models:
  pip-cache:
